# Optional Render Blueprint (Render dashboard -> New -> Blueprint).
# You can also create the Web Service by hand; see README "Deploy".
services:
  - type: web
    name: jobpilot
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Neon connection string in the dashboard
      - key: LLM_API_KEY
        sync: false # paste your Gemini API key in the dashboard
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: EMBED_MODEL
        value: gemini-embedding-2
      - key: EMBED_DIM
        value: "768"
      - key: ADMIN_TOKEN
        generateValue: true
